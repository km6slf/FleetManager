name: Build Windows app

# Builds the installer and the portable zip on every push to main, and publishes them:
# - every main build replaces the files on the "Development build (latest main)"
#   pre-release (tag dev-build), so the newest build is always at one public link;
# - a tag like v0.2.0 (or v0.2.0-alpha.1, published as a pre-release) gets its own release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else { $v = "0.1.0-dev." + "${{ github.sha }}".Substring(0, 7) }
          "version=$v" >> $env:GITHUB_OUTPUT
          "BUILD = `"$v`"" | Set-Content -Encoding utf8 src/aredn_fleet/_build.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pyinstaller pytest httpx

      - name: Test
        run: pytest -q

      - name: Bundle (PyInstaller)
        run: pyinstaller packaging/windows/fleet-manager.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the bundle
        shell: pwsh
        run: |
          # Launch like a double-click (no inherited console streams).
          $env:FLEET_SELFTEST_REPORT = "$PWD\selftest.txt"
          $p = Start-Process -FilePath dist\AREDN-Fleet-Manager\AREDN-Fleet-Manager.exe -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($p.ExitCode -ne 0) { throw "bundle self-test failed ($($p.ExitCode))" }
          if (-not (Select-String -Path selftest.txt -Pattern "selftest ok" -Quiet)) { throw "self-test did not report ok" }

      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $stage = "portable\AREDN-Fleet-Manager"
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item -Recurse dist\AREDN-Fleet-Manager $stage
          Copy-Item packaging\windows\portable.txt $stage\portable.txt
          Compress-Archive -Path $stage -DestinationPath "dist\AREDN-Fleet-Manager-$v-portable-win64.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: AREDN-Fleet-Manager-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/*-setup.exe
            dist/*-portable-win64.zip

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            dist/*-portable-win64.zip
          generate_release_notes: true
          # v1.2.3-alpha.1, -beta.2, -rc.1 ... are published as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish the development build
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          title="Development build (latest main)"
          notes="Built automatically from main at ${GITHUB_SHA::7}: $(git log -1 --format=%s). For testing only; it may be broken. Versioned releases are listed at https://github.com/${GITHUB_REPOSITORY}/releases"
          git tag -f dev-build "$GITHUB_SHA"
          git push -f origin refs/tags/dev-build
          if gh release view dev-build >/dev/null 2>&1; then
            gh release edit dev-build --prerelease --title "$title" --notes "$notes"
            gh release view dev-build --json assets -q '.assets[].name' | while read -r a; do
              [ -n "$a" ] && gh release delete-asset dev-build "$a" -y
            done
          else
            gh release create dev-build --prerelease --title "$title" --notes "$notes" --verify-tag
          fi
          gh release upload dev-build dist/*-setup.exe dist/*-portable-win64.zip --clobber
