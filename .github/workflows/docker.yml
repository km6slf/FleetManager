name: Docker images

# Builds the container images and publishes them to the GitHub Container Registry as
# ghcr.io/km6slf/fleetmanager, one name for every platform (Docker picks the right one):
#   linux/amd64, linux/arm64 (e.g. Raspberry Pi 4/5), windows/amd64 (Windows Server 2022 base)
# Tags:  dev            newest build of main
#        <version>      each release tag, e.g. 0.1.0-alpha.1
#        latest         newest release tag
# Each image is started and health-checked before it's published.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/km6slf/fleetmanager

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.t.outputs.names }}
      first: ${{ steps.t.outputs.first }}
    steps:
      - id: t
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
            echo "names=$v latest" >> "$GITHUB_OUTPUT"
            echo "first=$v" >> "$GITHUB_OUTPUT"
          else
            echo "names=dev" >> "$GITHUB_OUTPUT"
            echo "first=dev" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for a smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fleet-test:linux

      - name: Smoke test (starts, refuses without its password, health check, same link after restart)
        run: |
          set -e
          if docker run --rm -e AREDN_FLEET_DNS=10.0.0.1 fleet-test:linux; then
            echo "should refuse to start without FLEET_SECRETS_PASSWORD"; exit 1; fi
          docker volume create fleet-ci
          docker run -d --name f1 -p 8787:8787 -v fleet-ci:/data \
            -e FLEET_SECRETS_PASSWORD=ci-test -e AREDN_FLEET_DNS=10.0.0.1 fleet-test:linux
          for i in $(seq 1 30); do curl -fsS localhost:8787/healthz && break; sleep 1; done
          curl -fsS localhost:8787/healthz
          link1=$(docker logs f1 2>&1 | grep -o 'token=[^ ]*')
          tok=${link1#token=}
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8787/api/info)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "x-fleet-token: $tok" localhost:8787/api/info)" = 200
          curl -fsS -H "x-fleet-token: $tok" -H 'content-type: application/json' \
            -d '{"label":"ci","kind":"password","password":"NotARealPw-123"}' localhost:8787/api/creds
          docker rm -f f1
          docker run -d --name f2 -p 8787:8787 -v fleet-ci:/data \
            -e FLEET_SECRETS_PASSWORD=ci-test -e AREDN_FLEET_DNS=10.0.0.1 fleet-test:linux
          for i in $(seq 1 30); do curl -fsS localhost:8787/healthz && break; sleep 1; done
          test "$(docker logs f2 2>&1 | grep -o 'token=[^ ]*')" = "$link1"
          curl -fsS -H "x-fleet-token: $tok" localhost:8787/api/creds | grep -q '"label":"ci"'
          docker run --rm -v fleet-ci:/data --entrypoint sh fleet-test:linux -c \
            '! grep -r "NotARealPw-123" /data'
          docker rm -f f2

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.tags.outputs.first }}-linux

  windows:
    needs: tags
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Start the Docker engine (installed on the runner, not always running)
        shell: pwsh
        run: |
          $s = Get-Service docker -ErrorAction SilentlyContinue
          if (-not $s) { throw "Docker isn't installed on this runner image" }
          if ($s.Status -ne "Running") { Start-Service docker }
          foreach ($i in 1..30) { docker version 2>$null | Out-Null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 2 }
          docker version

      - name: Build
        run: docker build -f Dockerfile.windows --build-arg WINDOWS_VERSION=ltsc2022 -t fleet-test:windows .

      - name: Smoke test (starts, health check, token required)
        shell: pwsh
        run: |
          docker run -d --name f1 -e FLEET_SECRETS_PASSWORD=ci-test -e AREDN_FLEET_DNS=10.0.0.1 fleet-test:windows
          $ip = docker inspect -f "{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}" f1
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod "http://${ip}:8787/healthz" -TimeoutSec 3 | Out-Null; $ok = $true; break } catch { Start-Sleep 2 }
          }
          docker logs f1
          if (-not $ok) { throw "no health check answer" }
          $tok = ((docker logs f1 2>&1 | Select-String -Pattern 'token=(\S+)').Matches[0].Groups[1].Value)
          $code = try { (Invoke-WebRequest "http://${ip}:8787/api/info" -UseBasicParsing).StatusCode } catch { $_.Exception.Response.StatusCode.value__ }
          if ($code -ne 401) { throw "API answered without a token ($code)" }
          Invoke-RestMethod "http://${ip}:8787/api/info" -Headers @{ "x-fleet-token" = $tok } | Out-Null
          docker rm -f f1

      - name: Push
        shell: pwsh
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          $t = "${{ env.IMAGE }}:${{ needs.tags.outputs.first }}-windows-ltsc2022"
          docker tag fleet-test:windows $t
          docker push $t

  publish:
    # One name for all platforms: ghcr.io/km6slf/fleetmanager:<tag>
    needs: [tags, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine Linux and Windows images under each tag
        run: |
          src="${IMAGE}:${{ needs.tags.outputs.first }}"
          for name in ${{ needs.tags.outputs.names }}; do
            docker buildx imagetools create -t "${IMAGE}:${name}" "${src}-linux" "${src}-windows-ltsc2022"
          done
          docker buildx imagetools inspect "${IMAGE}:${{ needs.tags.outputs.first }}"
